<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is adhd-mode?", "acceptedAnswer": {"@type": "Answer", "text": "adhd-mode is an open-source project that ships 10 output rules making AI coding assistants produce ADHD-friendly output. You place a single AGENTS.md file in your repository root, and every AI coding tool that reads it \u2014 Codex, Cursor, GitHub Copilot, Windsurf, Gemini CLI, Aider, Zed, and 20+ others \u2014 automatically shapes its output to be action-first, numbered, and free of preamble. The rules are adapted from i-have-adhd (MIT)."}}, {"@type": "Question", "name": "How does adhd-mode work?", "acceptedAnswer": {"@type": "Answer", "text": "adhd-mode works by placing an AGENTS.md file at your repository root. AGENTS.md is a Linux Foundation-stewarded open standard that AI coding agents read automatically. When the agent starts, it reads the file and applies the 10 output rules to every response. No slash command, no plugin installation, no per-session invocation."}}, {"@type": "Question", "name": "How is adhd-mode different from i-have-adhd?", "acceptedAnswer": {"@type": "Answer", "text": "i-have-adhd is a skill you invoke each session. adhd-mode is always on. It also fixes rule decay, fabricated time estimates, and bloat. adhd-mode covers Copilot, Windsurf, and Gemini that the original doesn't fully support."}}, {"@type": "Question", "name": "How do I install adhd-mode?", "acceptedAnswer": {"@type": "Answer", "text": "Run: curl -O https://raw.githubusercontent.com/DevAnimecx/adhd-mode/main/AGENTS.md \u2014 then restart your editor. Or use the installer: curl -sSL https://raw.githubusercontent.com/DevAnimecx/adhd-mode/main/install/install.sh | bash"}}, {"@type": "Question", "name": "Which tools does adhd-mode support?", "acceptedAnswer": {"@type": "Answer", "text": "Codex, Cursor, GitHub Copilot, Windsurf, Gemini CLI, Claude Code, Aider, Zed, Factory, Jules, Devin, Amp, RooCode, and 20+ others via AGENTS.md."}}, {"@type": "Question", "name": "Does adhd-mode stop working after a few turns?", "acceptedAnswer": {"@type": "Answer", "text": "No. adhd-mode includes an anti-decay mechanism: explicit re-injection instructions. Say 'adhd mode' again and the AI re-applies all rules from scratch."}}, {"@type": "Question", "name": "Do I need an ADHD diagnosis?", "acceptedAnswer": {"@type": "Answer", "text": "No. The rules help anyone who wants action-first, no-filler AI output. Also works as 'action-first mode.'"}}, {"@type": "Question", "name": "Why doesn't adhd-mode use time estimates?", "acceptedAnswer": {"@type": "Answer", "text": "The #3 complaint about the original was fabricated estimates. adhd-mode uses scope-by-shape: Quick, Medium, Large."}}, {"@type": "Question", "name": "Is adhd-mode free?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. MIT licensed. No paid features, accounts, or telemetry."}}, {"@type": "Question", "name": "How do I turn it off?", "acceptedAnswer": {"@type": "Answer", "text": "Say 'stop adhd mode' or 'normal mode' in chat. Or delete the file."}}, {"@type": "Question", "name": "Can I customize the rules?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Fork the repo, edit scripts/build.py, run python scripts/build.py to regenerate. See CONTRIBUTING.md."}}, {"@type": "Question", "name": "Does adhd-mode waste tokens?", "acceptedAnswer": {"@type": "Answer", "text": "No. The rules are ~2KB. The output is shorter (no preamble), so responses use fewer tokens."}}, {"@type": "Question", "name": "What is AGENTS.md?", "acceptedAnswer": {"@type": "Answer", "text": "AGENTS.md is a Linux Foundation-stewarded open standard for giving AI coding agents project context. Read natively by 20+ tools. Over 60,000 repos use it."}}, {"@type": "Question", "name": "Can I use adhd-mode with i-have-adhd?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. They complement each other. Use the original for on-demand, adhd-mode for always-on. Same rules, no conflict."}}]}</script>
