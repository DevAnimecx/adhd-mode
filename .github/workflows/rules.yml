name: rules

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rule parity
        run: python scripts/check_parity.py
      - name: No hand-edited rule files
        run: python scripts/build.py --check
      - name: Installer smoke test
        run: bash install/install.sh --list
